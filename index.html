<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>India_edge</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0e1a2b">
<style>
:root{--bg:#0e1a2b;--bg2:#16273f;--ink:#eef2f7;--mute:#93a3ba;--line:#26395a;--saff:#ff9933;--green:#2fbf71;--red:#ff5c5c;--card:#13233a}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:radial-gradient(120% 80% at 50% 0%,#1d3557 0%,var(--bg) 60%);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.view{display:none;min-height:100%;padding:18px 16px 40px}
.view.on{display:block}
#clock{font-size:64px;font-weight:300;letter-spacing:-2px;margin-top:28px}
#date{color:var(--mute);margin-bottom:34px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 10px}
.app{display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;color:var(--ink);font-size:12px;cursor:pointer}
.ico{width:62px;height:62px;border-radius:18px;display:grid;place-items:center;font-size:28px;box-shadow:0 6px 16px #0006}
.app.soon{opacity:.45}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.back,.ref{background:var(--bg2);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:9px 13px;font-size:15px}
.top h1{font-size:20px;flex:1}
#stamp{font-size:12px;color:var(--mute);margin-bottom:10px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;position:sticky;top:0;background:var(--bg);padding-top:6px;z-index:2}
.tab{flex:none;background:var(--bg2);border:1px solid var(--line);color:var(--mute);border-radius:999px;padding:9px 15px;font-size:14px}
.tab.on{background:var(--saff);border-color:var(--saff);color:#1b1100;font-weight:600}
.panel{display:none}.panel.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.card h3{font-size:14px;margin-bottom:6px}
.n{display:block;color:var(--ink);text-decoration:none;padding:9px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.35}
.n:first-of-type{border-top:0}
.meta{display:block;color:var(--mute);font-size:11px;margin-top:3px}
.pos{color:var(--green)}.neg{color:var(--red)}
.tick{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
.tick div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.tick b{display:block;font-size:17px}.tick span{font-size:12px;color:var(--mute)}
.tick span.pos{color:var(--green)}.tick span.neg{color:var(--red)}
.note{font-size:12px;color:var(--mute);line-height:1.45;margin:6px 0 14px}
.stock{border-left:4px solid var(--mute)}
.stock.up{border-left-color:var(--green)}.stock.down{border-left-color:var(--red)}
.stock h3{font-size:17px}
.empty{color:var(--mute);font-size:13px;padding:6px 0}
.pick{border-left:5px solid var(--mute)}.pick.up{border-left-color:var(--green)}.pick.down{border-left-color:var(--red)}
.pick h2{font-size:20px;display:flex;justify-content:space-between;align-items:center}
.badge{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--mute)}
.dir{font-weight:700}.why{font-size:13px;color:var(--mute);margin:8px 0 2px}
.why b{color:var(--ink)}
.vgrid{display:grid;gap:14px}.vcard{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer}
.vcard .th{position:relative}.vcard img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#0006}
.vcard .pl{position:absolute;inset:0;display:grid;place-items:center;font-size:40px;color:#fff;text-shadow:0 2px 10px #000}
.vcard .vt{padding:10px 12px;font-size:14px;line-height:1.35}
#player{position:fixed;inset:0;background:#05080fee;display:none;z-index:50;overflow-y:auto;padding-top:env(safe-area-inset-top,0px)}
#player.on{display:block}.ptop{display:flex;gap:10px;align-items:center;padding:10px 14px}.ptop b{flex:1;font-size:14px;line-height:1.3}
.pwrap{position:relative;width:100%;aspect-ratio:16/9;background:#000}.pwrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.chip{display:inline-block;font-size:12px;padding:3px 9px;margin:3px 4px 0 0;border-radius:999px;border:1px solid var(--line);color:var(--mute)}
.chip.up{color:var(--green);border-color:#2fbf7166}.chip.dn{color:var(--red);border-color:#ff5c5c66}.rchip{flex:none}
.hi{font-size:11px;padding:2px 8px;border-radius:999px;background:#ff5c5c22;color:var(--red);margin-left:6px}.md{background:#ff993322;color:var(--saff)}
.globewrap{text-align:center;cursor:pointer;padding:6px 0 12px}
@keyframes spin{0%{transform:scaleX(1)}50%{transform:scaleX(.04)}100%{transform:scaleX(1)}}
.mer{transform-origin:100px 100px;animation:spin 6s linear infinite}
@keyframes ping{0%{r:4;opacity:.9}100%{r:16;opacity:0}}.ping{animation:ping 1.8s ease-out infinite}
.livegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:10px}
.lw{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.lh{padding:8px 10px;font-size:13px;display:flex;align-items:center;justify-content:space-between}
.lv{position:relative;aspect-ratio:16/9;background:#000;cursor:pointer;display:grid;place-items:center;color:#fff;font-size:34px}
.lv iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
</style>
</head>
<body>

<section id="home" class="view on">
  <div id="clock"></div>
  <div id="date"></div>
  <div class="grid" id="apps"></div>
</section>

<section id="edge" class="view">
  <div class="top">
    <button class="back" onclick="go('home')">Back</button>
    <h1>India_edge</h1>
    <button class="ref" onclick="loadEdge()">Refresh</button>
  </div>
  <div id="stamp">Loading...</div>
  <div class="tabs" id="tabs"></div>
  <div id="p0" class="panel on"></div>
  <div id="p1" class="panel"></div>
  <div id="p2" class="panel"></div>
  <div id="p3" class="panel"></div>
  <div id="p4" class="panel"></div>
  <div id="p5" class="panel">
    <div class="globewrap" onclick="toggleLive()">
      <svg viewBox="0 0 200 200" width="170" height="170">
        <defs><radialGradient id="gg" cx="35%" cy="30%"><stop offset="0" stop-color="#4b8bff"/><stop offset="1" stop-color="#0a1a33"/></radialGradient></defs>
        <circle cx="100" cy="100" r="92" fill="url(#gg)" stroke="#6f9cf0" stroke-width="2"/>
        <g fill="none" stroke="#a9c8ff" stroke-opacity=".55" stroke-width="1.2">
          <ellipse cx="100" cy="100" rx="92" ry="20"/><ellipse cx="100" cy="100" rx="92" ry="52"/>
          <ellipse class="mer" cx="100" cy="100" rx="70" ry="92" style="animation-delay:0s"/>
          <ellipse class="mer" cx="100" cy="100" rx="70" ry="92" style="animation-delay:-2s"/>
          <ellipse class="mer" cx="100" cy="100" rx="70" ry="92" style="animation-delay:-4s"/>
        </g>
        <circle cx="118" cy="82" r="4" fill="#ff9933"/><circle cx="118" cy="82" r="4" fill="none" stroke="#ff9933" class="ping"/>
      </svg>
      <div id="globehint" class="meta">Tap the globe for live share-market news</div>
    </div>
    <div id="liveGrid" class="livegrid" style="display:none"></div>
  </div>
</section>


<section id="picks" class="view">
  <div class="top">
    <button class="back" onclick="go('home')">Back</button>
    <h1>Evening picks</h1>
    <button class="ref" onclick="loadPicks()">Refresh</button>
  </div>
  <div id="pstamp" class="meta" style="margin-bottom:10px">Loading...</div>
  <div id="pbody"></div>
</section>

<section id="bt" class="view">
  <div class="top">
    <button class="back" onclick="go('home')">Back</button>
    <h1>Backtest</h1>
    <button class="ref" onclick="loadBT()">Refresh</button>
  </div>
  <div id="btstamp" class="meta" style="margin-bottom:10px">Loading...</div>
  <div id="btbody"></div>
</section>

<section id="global" class="view">
  <div class="top">
    <button class="back" onclick="go('home')">Back</button>
    <h1>Global_edge</h1>
    <button class="ref" onclick="loadGlobal()">Refresh</button>
  </div>
  <div id="gstamp" class="meta" style="margin-bottom:10px">Loading...</div>
  <div class="tabs">
    <button class="tab gtab on" data-t="news" onclick="gTab('news')">News</button>
    <button class="tab gtab" data-t="videos" onclick="gTab('videos')">▶ Videos</button>
  </div>
  <div id="gbody"></div>
</section>
<div id="player">
  <div class="ptop"><b id="ptitle"></b><button class="back" onclick="closePlayer()">Close</button></div>
  <div class="pwrap"><iframe id="pframe" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
  <div style="padding:10px 14px"><a id="pyt" class="meta" target="_blank" rel="noopener" style="color:var(--saff)">If the video will not play here, open it on YouTube</a></div>
  <div id="pnext" style="padding:0 14px 30px"></div>
</div>

<script>
/* Home screen buttons - add new apps here */
const APPS = [
  {name:'India_edge', icon:'🇮🇳', color:'#ff9933', page:'edge'},
  {name:'Evening_picks', icon:'🎯', color:'#e11d48', page:'picks'},
  {name:'Backtest', icon:'🧪', color:'#0ea5e9', page:'bt'},
  {name:'Global_edge', icon:'🌍', color:'#3b82f6', page:'global'},
  {name:'Watchlist', icon:'📈', color:'#2fbf71', soon:true},
  {name:'Crypto', icon:'₿', color:'#f59e0b', soon:true},
  {name:'Notes', icon:'📝', color:'#a855f7', soon:true},
  {name:'Files', icon:'📁', color:'#06b6d4', soon:true},
];
const $ = id => document.getElementById(id);
function go(v){stopLive();document.querySelectorAll('.view').forEach(e=>e.classList.remove('on'));$(v).classList.add('on');window.scrollTo(0,0);if(v==='edge')loadEdge();if(v==='picks')loadPicks();if(v==='bt')loadBT();if(v==='global')loadGlobal()}
$('apps').innerHTML = APPS.map(a=>`<button class="app ${a.soon?'soon':''}" ${a.soon?'':`onclick="go('${a.page}')"`}><div class="ico" style="background:${a.color}">${a.icon}</div>${a.name}</button>`).join('');
function tick(){const d=new Date();$('clock').textContent=d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});$('date').textContent=d.toLocaleDateString([], {weekday:'long',day:'numeric',month:'long'})}
tick();setInterval(tick,20000);

const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ago=iso=>{const m=Math.max(0,Math.round((Date.now()-new Date(iso))/60000));return m<60?m+'m ago':m<1440?Math.round(m/60)+'h ago':Math.round(m/1440)+'d ago'};
const list=(items,n=6)=>items&&items.length?items.slice(0,n).map(i=>`<a class="n" href="${esc(i.link)}" target="_blank" rel="noopener">${esc(i.title)}<span class="meta">${esc(i.src)} · ${ago(i.time)}</span></a>`).join(''):'<div class="empty">No fresh items.</div>';
const card=(h,b)=>`<div class="card"><h3>${h}</h3>${b}</div>`;
const chg=q=>q&&q.chg!=null?`<span class="${q.chg>=0?'pos':'neg'}">${q.chg>=0?'+':''}${q.chg.toFixed(2)}%</span>`:'';

const TABS=['News','Macro data','RBI','Government','Stocks','🌐 Live news'];
$('tabs').innerHTML=TABS.map((t,i)=>`<button class="tab ${i?'':'on'}" onclick="tab(${i})">${t}</button>`).join('');
function tab(i){if(i!==5)stopLive();if(i===5)loadLive();document.querySelectorAll('#tabs .tab').forEach((e,k)=>e.classList.toggle('on',k===i));document.querySelectorAll('.panel').forEach((e,k)=>e.classList.toggle('on',k===i))}

async function loadEdge(){
  $('stamp').textContent='Loading...';
  try{
    const r=await fetch('data.json?t='+Date.now());
    if(!r.ok) throw new Error(r.status);
    const d=await r.json();
    $('p0').innerHTML=card('Top market-moving headlines',list(d.news,12));

    const t=d.indices.map(q=>`<div><span>${esc(q.name)}</span><b>${q.price!=null?q.price.toLocaleString('en-IN',{maximumFractionDigits:2}):'n/a'}</b>${chg(q)}</div>`).join('');
    const wb=(l,x)=>x?`<div><span>${l} (${x.date}, annual)</span><b>${x.value}%</b><span>World Bank</span></div>`:'';
    $('p1').innerHTML=`<div class="tick">${t}${wb('CPI',d.wb.cpi)}${wb('GDP growth',d.wb.gdp)}</div>`+
      d.macro.map(m=>card(esc(m.name)+' - latest',list(m.items,2))).join('')+
      '<div class="note">Prices come from Yahoo Finance (unofficial, may be delayed). Monthly releases appear as the latest headlines from publishers. Official sources: mospi.gov.in, rbi.org.in, spglobal.com/marketintelligence.</div>';

    $('p2').innerHTML=d.rbi.map(x=>card(esc(x.name),list(x.items,5))).join('');
    $('p3').innerHTML=d.gov.map(x=>card(esc(x.name),list(x.items,5))).join('');

    $('p4').innerHTML=(d.stocks.length?d.stocks.map(x=>{
      const lean=x.score>0?['up','Positive news tilt']:x.score<0?['down','Negative news tilt']:['','Mixed / unclear tilt'];
      const pr=x.stocks.map(s=>`${esc(s.sym)} ${s.price!=null?s.price.toFixed(1):''} ${chg(s)}`).join(' · ');
      return `<div class="card stock ${lean[0]}"><h3>${esc(x.why)}</h3><div style="font-size:14px;margin:4px 0 8px">${pr}</div><div class="meta" style="margin-bottom:6px">${lean[1]} · ${x.hits.length} headline${x.hits.length>1?'s':''}</div>${list(x.hits,2)}</div>`}).join(''):'<div class="empty">No clear stock links in current headlines.</div>')+
      '<div class="note">Keyword-based filter, not a prediction. It links headline themes to sectors that usually react and scores the wording as positive or negative. Check the linked source and the chart. Not investment advice.</div>';

    $('stamp').textContent='Data updated '+ago(d.generated)+' (server refreshes about every 15 min)';
  }catch(e){
    $('stamp').textContent='Could not load data.json. Open this page from your GitHub Pages link, not as a local file.';
  }
}

function pickCard(p){
  const up=p.dir==='UP';
  const price=p.close!=null?`Close ${p.close} (${p.today_chg>=0?'+':''}${p.today_chg}% today${p.vol_ratio?', volume '+p.vol_ratio+'x avg':''})`:'';
  const link=x=>`<a class="n" href="${esc(x.link)}" target="_blank" rel="noopener"><b>${esc(x.label)}</b>: ${esc(x.title)}<span class="meta">${esc(x.src)} · ${ago(x.time)}${x.when?' · <b class="'+(x.when==='after close'?'pos':'')+'">'+esc(x.when)+'</b>':''}</span></a>`;
  const rs=p.reasons.map(link).join('');
  const sr=p.sector_reasons.map(x=>link({...x,label:p.sector+' sector, '+x.label})).join('');
  return `<div class="card pick ${up?'up':'down'}"><h2>${esc(p.sym)}<span class="dir ${up?'pos':'neg'}">${up?'▲ UP bias':'▼ DOWN bias'}</span></h2>
    <div style="margin:6px 0"><span class="badge">Confidence: ${esc(p.confidence)}</span> <span class="badge">Score ${p.net}</span> <span class="badge">${p.sources} trusted source${p.sources==1?'':'s'}</span></div>
    <div class="meta">${esc(price)}</div>${p.flag?`<div class="meta neg">${esc(p.flag)}</div>`:''}${p.chart_note?`<div class="meta">${esc(p.chart_note)}</div>`:''}
    <div class="why"><b>Layers</b> (agree ${p.agree} of 6): ${Object.entries(p.layers||{}).map(([k,v])=>`${k} <span class="${v>0?'pos':v<0?'neg':''}">${v>0?'+':''}${v}</span>`).join(' · ')}</div>${(p.tech_notes&&p.tech_notes.length)?`<div class="meta">Chart and flow: ${esc(p.tech_notes.join('; '))}</div>`:''}</div>${rs}${sr}</div>`;
}
async function loadPicks(){
  $('pstamp').textContent='Loading...';
  try{
    const r=await fetch('picks.json?t='+Date.now());
    if(!r.ok) throw new Error(r.status);
    const d=await r.json();
    const rate=x=>x&&x.total?Math.round(100*x.hits/x.total)+'% ('+x.hits+' of '+x.total+')':'no results yet';
    const sec=(t,arr,e)=>`<h3 style="margin:14px 0 8px;font-size:16px">${t}</h3>`+(arr.length?arr.map(pickCard).join(''):card('None today','<div class="empty">'+e+'</div>'));
    const cu=(d.cues||[]).map(q=>`<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:13px"><span>${esc(q.name)}</span><span>${q.price} <span class="${q.chg>=0?'pos':'neg'}">${q.chg>=0?'+':''}${q.chg}%</span></span></div>`).join('');
    let h=(cu?card('Global cues (last close)',cu+'<div class="meta" style="margin-top:6px">US markets close after this evening run. For intraday, re-check these at about 8:30 AM India time: if they moved sharply overnight, treat the picks with caution. News tagged <b class="pos">after close</b> has not traded yet; news tagged before close is mostly priced in.</div>'):'')+sec('▲ Up bias (top 3)',d.picks_up,'No stock scored high enough on positive news.')+sec('▼ Down bias (top 3)',d.picks_down,'No stock scored high enough on negative news.');
    h+=card('Track record (live)','<div style="font-size:15px">All: <b>'+rate(d.stats.all)+'</b><br>Up picks: <b>'+rate(d.stats.up)+'</b><br>Down picks: <b>'+rate(d.stats.down)+'</b>'+(d.stats.tiers?'<br>By confidence: '+Object.entries(d.stats.tiers).map(([k,v])=>k+' <b>'+rate(v)+'</b>').join(' · '):'')+'</div><div class="meta">A hit means the next close moved in the predicted direction. Judge each confidence level only after 30 to 50 picks. These numbers, not a promise, show the real accuracy.</div>'+
      (d.recent.length?d.recent.map(x=>`<div class="meta" style="margin-top:6px">${x.date} · ${esc(x.sym)} ${x.dir} · ${x.result?(x.result.hit?'<span class="pos">hit</span>':'<span class="neg">miss</span>')+' ('+(x.result.chg>=0?'+':'')+x.result.chg+'%)':'pending'}</div>`).join(''):''));
    h+='<div class="note">Scanned '+d.scanned+' stocks after market close, weighting news from Reuters, Bloomberg, Economic Times, Business Standard, Mint, Moneycontrol, CNBC-TV18 and similar outlets more than unknown sources. A news-scoring engine, not a prediction or advice. A high score means strong, fresh news, not that the stock must move. Use a stop-loss and small position size, and paper trade first.</div>';
    $('pbody').innerHTML=h;
    setBadge(d.picks_up.length,d.picks_down.length);$('pstamp').textContent='Picks for '+d.date+', generated '+ago(d.generated);
  }catch(e){
    $('pstamp').textContent='No picks yet. The engine runs on weekdays at 5:30 PM India time, or run it manually from GitHub Actions.';
    $('pbody').innerHTML='';
  }
}

async function loadBT(){
  $('btstamp').textContent='Loading...';
  try{
    const r=await fetch('backtest.json?t='+Date.now());
    if(!r.ok) throw new Error(r.status);
    const d=await r.json(), P=d.params;
    const row=(n,x)=>x&&x.n?`<tr><td>${n}</td><td>${x.n}</td><td>${x.hit_rate}%</td><td class="${x.avg_net_pct>=0?'pos':'neg'}">${x.avg_net_pct}%</td><td>${x.profit_factor==null?'-':x.profit_factor}</td></tr>`:`<tr><td>${n}</td><td colspan="4">no trades</td></tr>`;
    const tbl=rows=>`<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px"><tr style="color:var(--mute);text-align:left"><th>Group</th><th>Trades</th><th>Hit rate</th><th>Avg net / trade</th><th>Profit factor</th></tr>${rows}</table></div>`;
    const eq=(n,x)=>x&&x.days?`<div class="meta" style="margin-top:6px">${n}: ${x.days} days, total ${x.total_return_pct}%, max drawdown ${x.max_drawdown_pct}%, Sharpe ${x.sharpe}</div>`:'';
    let h=card('Realistic case: enter next open, exit next close, after costs',tbl(row('All, whole period',d.all.oc)+row('Older 60% (used to design rules)',d.in_sample.oc)+row('Newest 40% (not used to design)',d.out_of_sample.oc)+row('UP picks',d.up.oc)+row('DOWN picks',d.down.oc))+eq('Newest 40%',d.equity.out_of_sample.oc)+eq('Older 60%',d.equity.in_sample.oc));
    h+=card('By confidence, realistic case',tbl(['High','Medium','Low'].map(k=>row(k+' (all)',d.tiers[k].all.oc)+row(k+' (newest 40%)',d.tiers[k].out_of_sample.oc)).join('')));
    h+=card('Enter at the close, exit next close (not tradable after picks)',tbl(row('All',d.all.cc)+row('Newest 40%',d.out_of_sample.cc)));
    h+=card('How to read it','<div class="meta">Baseline: on '+d.baseline.stock_days+' stock-days, '+d.baseline.pct_days_up+'% closed up. A real edge needs a hit rate clearly above 50% AND a positive average net return after costs, mainly in the newest 40%. Profit factor above 1.2 is worth attention. Each trade cost '+P.cost_pct_per_trade+'%.</div>');
    h+='<div class="note"><b>Limits:</b><br>'+d.caveats.map(x=>'• '+esc(x)).join('<br>')+'</div>';
    $('btbody').innerHTML=h;
    $('btstamp').textContent=P.stocks+' stocks, '+P.first_day+' to '+P.last_day+', '+P.picks_per_side_per_day+' picks per side per day. Run '+ago(d.generated);
  }catch(e){
    $('btstamp').textContent='No backtest yet. Run the backtest workflow from GitHub Actions.';
    $('btbody').innerHTML='';
  }
}

/* Live tab icon and title: green when picks lean up, red when they lean down, saffron when balanced */
function setBadge(up,down){
  try{
    const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');
    x.fillStyle='#0e1a2b';x.fillRect(0,0,64,64);
    x.lineWidth=5;x.strokeStyle='#ff9933';x.beginPath();x.arc(32,32,26,0,7);x.stroke();
    const col=up>down?'#2fbf71':down>up?'#ff5c5c':'#ff9933';
    x.fillStyle=col;x.beginPath();
    if(down>up){x.moveTo(32,48);x.lineTo(46,26);x.lineTo(18,26);}else{x.moveTo(32,16);x.lineTo(46,38);x.lineTo(18,38);}
    x.fill();
    let l=document.querySelector('link[rel="icon"]');if(!l){l=document.createElement('link');l.rel='icon';document.head.appendChild(l)}
    l.type='image/png';l.href=c.toDataURL('image/png');
    document.title='Edge ▲'+up+' ▼'+down;
  }catch(e){}
}
fetch('picks.json?t='+Date.now()).then(r=>r.json()).then(d=>setBadge(d.picks_up.length,d.picks_down.length)).catch(()=>{});

let GL=null,glRegion=0,glMed=false,glTab='news',GR=['All'];
async function loadGlobal(){
  $('gstamp').textContent='Loading...';
  try{
    const r=await fetch('global.json?t='+Date.now());
    if(!r.ok) throw new Error(r.status);
    GL=await r.json();
    $('gstamp').textContent='Updated '+ago(GL.generated)+' · trusted outlets only';
    renderGlobal();
  }catch(e){
    $('gstamp').textContent='No global data yet. Run the global-edge workflow from GitHub Actions.';
    $('gbody').innerHTML='';
  }
}
function gTab(t){glTab=t;document.querySelectorAll('.gtab').forEach(e=>e.classList.toggle('on',e.dataset.t===t));renderGlobal()}
function setRegion(i){glRegion=i;renderGlobal()}
function toggleMed(){glMed=!glMed;renderGlobal()}
function chips(secs){return (secs||[]).map(s=>`<span class="chip ${s.dir>0?'up':'dn'}">${esc(s.sector)} ${s.dir>0?'▲':'▼'}${s.stocks?' ('+esc(s.stocks)+')':''}</span>`).join('')}
function renderGlobal(){
  if(!GL) return;
  if(glTab==='videos'){renderVideos();return}
  const b=GL.bias||{sectors:[]};
  GR=['All',...new Set(GL.news.map(x=>x.region))];
  if(glRegion>=GR.length) glRegion=0;
  const reg=GR[glRegion];
  const items=GL.news.filter(x=>(reg==='All'||x.region===reg)&&(glMed||x.level==='High'));
  const tone=b.score<=-1.5?'neg':b.score>=1.5?'pos':'';
  let h=card('Global bias for the Indian market',`<div style="font-size:18px;font-weight:700" class="${tone}">${esc(b.label||'')}</div><div class="meta">Score ${b.score} from ${GL.news.length} market-moving stories</div>`+
    (b.sectors&&b.sectors.length?'<div style="margin-top:6px">'+b.sectors.map(s=>`<span class="chip ${s.score>0?'up':'dn'}">${esc(s.sector)} ${s.score>0?'▲':'▼'}${s.stocks?' ('+esc(s.stocks)+')':''}</span>`).join('')+'</div>':''));
  h+='<div class="tabs" style="position:static;padding-top:0">'+GR.map((r,i)=>`<button class="tab rchip ${i===glRegion?'on':''}" onclick="setRegion(${i})">${esc(r)}</button>`).join('')+`<button class="tab rchip ${glMed?'on':''}" onclick="toggleMed()">${glMed?'High + medium':'High only'}</button></div>`;
  h+=items.length?items.map(x=>`<div class="card"><div class="meta">${esc(x.flag)} ${esc(x.region)} · ${esc(x.label)}<span class="hi ${x.level==='High'?'':'md'}">${esc(x.level)} impact</span></div>
    <a class="n" style="border:0;padding:6px 0" href="${esc(x.link)}" target="_blank" rel="noopener">${esc(x.title)}<span class="meta">${esc(x.src)} · ${ago(x.time)} · ${x.confirmed_by>1?'<b class="pos">confirmed by '+x.confirmed_by+' trusted outlets</b>':'single trusted source'}</span></a>
    <div class="why"><b>Why it matters for India:</b> ${esc(x.why)}</div>${chips(x.sectors)}</div>`).join(''):'<div class="empty">No high-impact story in this region right now. That is a valid result.</div>';
  h+='<div class="note">Only trusted outlets (Reuters, Bloomberg, FT, WSJ, CNBC, AP, BBC, Al Jazeera, Nikkei and major Indian business papers) are used, and only stories that match an Indian-market impact rule are shown. The rules are a filter, not a prediction. Always open the source link and check the facts.</div>';
  $('gbody').innerHTML=h;
}
function renderVideos(){
  const v=GL.videos||[];
  if(!v.length){$('gbody').innerHTML=card('No videos right now','<div class="empty">The video feeds returned nothing. Try again after the next update.</div>');return}
  $('gbody').innerHTML='<div class="meta" style="margin-bottom:8px">'+v.length+' market videos from official channels'+(GL.channels_ok?': '+esc(GL.channels_ok.join(', ')):'')+'. Tap one to play with sound.</div><div class="vgrid">'+
    v.map((x,i)=>`<div class="vcard" onclick="openPlayer(${i})"><div class="th"><img loading="lazy" src="${esc(x.thumb)}" alt=""><div class="pl">▶</div></div><div class="vt">${esc(x.title)}<span class="meta">${esc(x.channel)} · ${ago(x.published)}</span></div></div>`).join('')+'</div>';
}
function openPlayer(i){
  const v=GL.videos[i];if(!v) return;
  $('ptitle').textContent=v.title;
  $('pframe').src='https://www.youtube-nocookie.com/embed/'+v.id+'?autoplay=1&playsinline=1&rel=0&modestbranding=1';
  $('pyt').href=v.url;
  $('pnext').innerHTML='<h3 style="margin:10px 0 8px;font-size:15px">Up next</h3>'+GL.videos.map((x,k)=>k===i?'':`<div class="vcard" style="margin-bottom:10px" onclick="openPlayer(${k})"><div class="th"><img loading="lazy" src="${esc(x.thumb)}" alt=""><div class="pl">▶</div></div><div class="vt">${esc(x.title)}<span class="meta">${esc(x.channel)} · ${ago(x.published)}</span></div></div>`).join('');
  $('player').classList.add('on');$('player').scrollTop=0;
}
function closePlayer(){$('pframe').src='';$('player').classList.remove('on')}

let LIVE=null,liveOpen=false;
async function loadLive(){
  if(LIVE) return;
  try{const r=await fetch('global.json?t='+Date.now());const d=await r.json();LIVE=(d.live||[]).slice(0,6)}catch(e){LIVE=[]}
}
async function toggleLive(){await loadLive();liveOpen=!liveOpen;renderLive()}
function renderLive(){
  const g=$('liveGrid');
  if(!liveOpen){g.style.display='none';g.innerHTML='';$('globehint').textContent='Tap the globe for live share-market news';return}
  $('globehint').textContent='Live business news. Tap a window to play with sound.';
  if(!LIVE.length){g.style.display='block';g.innerHTML='<div class="empty">No live channels found yet. Run the global-edge workflow (or python global_edge.py) once, then refresh.</div>';return}
  g.style.display='grid';
  g.innerHTML=LIVE.map((x,i)=>`<div class="lw"><div class="lh"><b>${esc(x.name)}</b><span class="hi">LIVE</span></div><div class="lv" id="lv${i}" onclick="playLive(${i})">▶</div><div class="lh"><a class="meta" style="color:var(--saff)" href="https://www.youtube.com/channel/${esc(x.id)}/live" target="_blank" rel="noopener">Open on YouTube</a></div></div>`).join('');
}
function playLive(i){
  if(!LIVE||!LIVE[i]) return;
  LIVE.forEach((x,k)=>{const e=$('lv'+k);if(e&&k!==i)e.innerHTML='▶'});
  $('lv'+i).innerHTML='<iframe src="https://www.youtube.com/embed/live_stream?channel='+encodeURIComponent(LIVE[i].id)+'&autoplay=1&playsinline=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>';
}
function stopLive(){if(!LIVE)return;LIVE.forEach((x,k)=>{const e=$('lv'+k);if(e)e.innerHTML='▶'})}
setInterval(()=>{if($('edge').classList.contains('on'))loadEdge()},300000);
