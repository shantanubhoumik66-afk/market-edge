<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>India_edge</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0e1a2b">
<style>
:root{--bg:#0e1a2b;--bg2:#16273f;--ink:#eef2f7;--mute:#93a3ba;--line:#26395a;--saff:#ff9933;--green:#2fbf71;--red:#ff5c5c;--card:#13233a}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg) radial-gradient(120% 80% at 50% 0%,#1d3557 0%,var(--bg) 60%) no-repeat fixed;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.view{display:none;min-height:100%;padding:18px 16px 40px}
.view.on{display:block}
#clock{font-size:64px;font-weight:300;letter-spacing:-2px;margin-top:28px}
#date{color:var(--mute);margin-bottom:34px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 10px}
.app{display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;color:var(--ink);font-size:12px;cursor:pointer}
.ico{width:62px;height:62px;border-radius:18px;display:grid;place-items:center;font-size:28px;box-shadow:0 6px 16px #0006}
.app.soon{opacity:.45}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.back,.ref{background:var(--bg2);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:9px 13px;font-size:15px}
.top h1{font-size:20px;flex:1}
#stamp{font-size:12px;color:var(--mute);margin-bottom:10px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;position:sticky;top:0;background:var(--bg);padding-top:6px;z-index:2}
.tab{flex:none;background:var(--bg2);border:1px solid var(--line);color:var(--mute);border-radius:999px;padding:9px 15px;font-size:14px}
.tab.on{background:var(--saff);border-color:var(--saff);color:#1b1100;font-weight:600}
.panel{display:none}.panel.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.card h3{font-size:14px;margin-bottom:6px}
.n{display:block;color:var(--ink);text-decoration:none;padding:9px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.35}
.n:first-of-type{border-top:0}
.meta{display:block;color:var(--mute);font-size:11px;margin-top:3px}
.pos{color:var(--green)}.neg{color:var(--red)}
.tick{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
.tick div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.tick b{display:block;font-size:17px}.tick span{font-size:12px;color:var(--mute)}
.tick span.pos{color:var(--green)}.tick span.neg{color:var(--red)}
.note{font-size:12px;color:var(--mute);line-height:1.45;margin:6px 0 14px}
.stock{border-left:4px solid var(--mute)}
.stock.up{border-left-color:var(--green)}.stock.down{border-left-color:var(--red)}
.stock h3{font-size:17px}
.empty{color:var(--mute);font-size:13px;padding:6px 0}
.pick{border-left:5px solid var(--mute)}.pick.up{border-left-color:var(--green)}.pick.down{border-left-color:var(--red)}
.pick h2{font-size:20px;display:flex;justify-content:space-between;align-items:center}
.badge{display:inline-block;white-space:nowrap;margin-bottom:4px;font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--mute)}
.dir{font-weight:700}.why{font-size:13px;color:var(--mute);margin:8px 0 2px}
.why b{color:var(--ink)}
.vgrid{display:grid;gap:14px}.vcard{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer}
.vcard .th{position:relative}.vcard img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#0006}
.vcard .pl{position:absolute;inset:0;display:grid;place-items:center;font-size:40px;color:#fff;text-shadow:0 2px 10px #000}
.vcard .vt{padding:10px 12px;font-size:14px;line-height:1.35}
#player{position:fixed;inset:0;background:#05080fee;display:none;z-index:50;overflow-y:auto;padding-top:env(safe-area-inset-top,0px)}
#player.on{display:block}.ptop{display:flex;gap:10px;align-items:center;padding:10px 14px}.ptop b{flex:1;font-size:14px;line-height:1.3}
.pwrap{position:relative;width:100%;aspect-ratio:16/9;background:#000}.pwrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.chip{display:inline-block;font-size:12px;padding:3px 9px;margin:3px 4px 0 0;border-radius:999px;border:1px solid var(--line);color:var(--mute)}
.chip.up{color:var(--green);border-color:#2fbf7166}.chip.dn{color:var(--red);border-color:#ff5c5c66}.rchip{flex:none}
.hi{font-size:11px;padding:2px 8px;border-radius:999px;background:#ff5c5c22;color:var(--red);margin-left:6px}.md{background:#ff993322;color:var(--saff)}
.globewrap{text-align:center;cursor:pointer;padding:6px 0 12px}
@keyframes spin{0%{transform:scaleX(1)}50%{transform:scaleX(.04)}100%{transform:scaleX(1)}}
.mer{transform-origin:100px 100px;animation:spin 6s linear infinite}
@keyframes ping{0%{r:4;opacity:.9}100%{r:16;opacity:0}}.ping{animation:ping 1.8s ease-out infinite}
.livegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:10px}
.lw{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.lh{padding:8px 10px;font-size:13px;display:flex;align-items:center;justify-content:space-between}
.lv{position:relative;aspect-ratio:16/9;background:#000;cursor:pointer;display:grid;place-items:center;color:#fff;font-size:34px}
.lv iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.warn{display:block;background:#ff993318;border:1px solid #ff993355;color:var(--saff);border-radius:10px;padding:8px 10px;font-size:12px;line-height:1.4;margin:6px 0 10px}
.verdict{font-size:15px;font-weight:700;margin:2px 0 6px}
.tw{overflow-x:auto;margin:0 -4px}.ltab{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}.ltab td,.ltab th{padding:5px 4px;border-top:1px solid var(--line);text-align:left}.ltab th{color:var(--mute);font-weight:500;border-top:0}
#offline{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));background:#2a1d0a;border:1px solid var(--saff);color:var(--saff);padding:7px 14px;border-radius:999px;font-size:12px;z-index:60}
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px;margin-top:4px}
.heat div{border-radius:10px;padding:8px;font-size:12px;border:1px solid var(--line)}.heat b{display:block;font-size:14px;margin-top:2px}
.breadth{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--line);margin:8px 0 4px}
.breadth i{display:block;height:100%}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.row:first-of-type{border-top:0}.row .nm{flex:1;min-width:0}.row .nm span{display:block;font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .px{text-align:right;min-width:74px}.row .px span{display:block;font-size:12px}
.star{background:none;border:0;font-size:20px;color:var(--mute);padding:2px 4px;cursor:pointer;line-height:1}.star.on{color:var(--saff)}
.search{width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:15px;margin-bottom:10px}
.wn{font-size:12px;margin-top:4px}.wn a{color:var(--ink);text-decoration:none;display:block;padding:3px 0}
.snd{background:var(--bg2);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:6px 10px;font-size:12px;width:100%}
</style>
</head>
<body>

<section id="home" class="view on">
  <div id="clock"></div>
  <div id="date"></div>
  <div class="grid" id="apps"></div>
</section>

<section id="edge" class="view">
  <div class="top">
    <button class="back" onclick="go('home')">Back</button>
    <h1>India_edge</h1>
    <button class="ref" onclick="loadEdge(true)">Refresh</button>
  </div>
  <div id="stamp">Loading...</div>
  <div class="tabs" id="tabs"></div>
  <div id="p0" class="panel on"></div>
  <div id="pm" class="panel"></div>
  <div id="p1" class="panel"></div>
  <div id="p2" class="panel"></div>
  <div id="p3" class="panel"></div>
  <div id="p4" class="panel"></div>
  <div id="p5" class="panel">
    <div class="globewrap" onclick="toggleLive()">
      <svg viewBox="0 0 200 200" width="170" height="170">
        <defs><radialGradient id="gg" cx="35%" cy="30%"><stop offset="0" stop-color="#4b8bff"/><stop offset="1" stop-color="#0a1a33"/></radialGradient></defs>
        <circle cx="100" cy="100" r="92" fill="url(#gg)" stroke="#6f9cf0" stroke-width="2"/>
        <g fill="none" stroke="#a9c8ff" stroke-opacity=".55" stroke-width="1.2">
          <ellipse cx="100" cy="100" rx="92" ry="20"/><ellipse cx="100" cy="100" rx="92" ry="52"/>
          <ellipse class="mer" cx="100" cy="100" rx="70" ry="92" style="animation-delay:0s"/>
          <ellipse class="mer" cx="100" cy="100" rx="70" ry="92" style="animation-delay:-2s"/>
          <ellipse class="mer" cx="100" cy="100" rx="70" ry="92" style="animation-delay:-4s"/>
        </g>
        <circle cx="118" cy="82" r="4" fill="#ff9933"/><circle cx="118" cy="82" r="4" fill="none" stroke="#ff9933" class="ping"/>
      </svg>
      <div id="globehint" class="meta">Tap the globe for live share-market news</div>
    </div>
    <div id="liveGrid" class="livegrid" style="display:none"></div>
  </div>
</section>


<section id="picks" class="view">
  <div class="top">
    <button class="back" onclick="go('home')">Back</button>
    <h1>Evening picks</h1>
    <button class="ref" onclick="loadPicks(true)">Refresh</button>
  </div>
  <div id="pstamp" class="meta" style="margin-bottom:10px">Loading...</div>
  <div id="pbody"></div>
</section>

<section id="bt" class="view">
  <div class="top">
    <button class="back" onclick="go('home')">Back</button>
    <h1>Backtest</h1>
    <button class="ref" onclick="loadBT(true)">Refresh</button>
  </div>
  <div id="btstamp" class="meta" style="margin-bottom:10px">Loading...</div>
  <div id="btbody"></div>
</section>

<section id="watch" class="view">
  <div class="top">
    <button class="back" onclick="go('home')">Back</button>
    <h1>Watchlist</h1>
    <button class="ref" onclick="loadWatch(true)">Refresh</button>
  </div>
  <div id="wstamp" class="meta" style="margin-bottom:10px">Loading...</div>
  <div id="wbody"></div>
  <input id="wq" class="search" type="search" placeholder="Search stocks to add (name, symbol or sector)" oninput="renderWatchAll()" autocomplete="off">
  <div id="wall"></div>
</section>

<section id="global" class="view">
  <div class="top">
    <button class="back" onclick="go('home')">Back</button>
    <h1>Global_edge</h1>
    <button class="ref" onclick="loadGlobal(true)">Refresh</button>
  </div>
  <div id="gstamp" class="meta" style="margin-bottom:10px">Loading...</div>
  <div class="tabs">
    <button class="tab gtab on" data-t="news" onclick="gTab('news')">News</button>
    <button class="tab gtab" data-t="videos" onclick="gTab('videos')">▶ Videos</button>
  </div>
  <div id="gbody"></div>
</section>
<div id="player">
  <div class="ptop"><b id="ptitle"></b><button class="back" onclick="closePlayer()">Close</button></div>
  <div class="pwrap"><iframe id="pframe" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
  <div style="padding:10px 14px"><a id="pyt" class="meta" target="_blank" rel="noopener" style="color:var(--saff)">If the video will not play here, open it on YouTube</a></div>
  <div id="pnext" style="padding:0 14px 30px"></div>
</div>

<div id="offline">Offline: showing the last saved data</div>
<script>
/* Home screen buttons - add new apps here */
const APPS = [
  {name:'India_edge', icon:'🇮🇳', color:'#ff9933', page:'edge'},
  {name:'Evening_picks', icon:'🎯', color:'#e11d48', page:'picks'},
  {name:'Backtest', icon:'🧪', color:'#0ea5e9', page:'bt'},
  {name:'Global_edge', icon:'🌍', color:'#3b82f6', page:'global'},
  {name:'Watchlist', icon:'📈', color:'#2fbf71', page:'watch'},
  {name:'Crypto', icon:'₿', color:'#f59e0b', soon:true},
  {name:'Notes', icon:'📝', color:'#a855f7', soon:true},
  {name:'Files', icon:'📁', color:'#06b6d4', soon:true},
];
const $ = id => document.getElementById(id);
/* Navigation uses the URL hash, so the phone's Back button and shared links (…/#picks) work */
const VIEWS=['home','edge','picks','bt','global','watch'];
let CUR='home';
function show(v){
  if(!VIEWS.includes(v))v='home';
  stopLive();if($('player').classList.contains('on'))closePlayer(true);
  document.querySelectorAll('.view').forEach(e=>e.classList.remove('on'));$(v).classList.add('on');window.scrollTo(0,0);CUR=v;
  if(v==='edge')loadEdge();if(v==='picks')loadPicks();if(v==='bt')loadBT();if(v==='global')loadGlobal();if(v==='watch')loadWatch();
}
function go(v){
  if(v==='home'&&history.state&&history.state.inApp){history.back();return}
  const h=v==='home'?location.pathname+location.search:'#'+v;
  if(('#'+v)!==location.hash||v==='home')history.pushState({inApp:v!=='home'},'',h);
  show(v);
}
let skipPop=false;
window.addEventListener('popstate',e=>{
  if(skipPop){skipPop=false;return}
  if($('player').classList.contains('on')&&!(e.state&&e.state.player)){closePlayer(true);return}
  show(location.hash.slice(1)||'home');
});

/* One place to load JSON: shared between screens, kept for 60 s, works offline through the service worker */
const JC={},INFLIGHT={};
async function getJSON(name,force){
  const c=JC[name];
  if(!force&&c&&Date.now()-c.at<60000)return c.data;
  if(INFLIGHT[name])return INFLIGHT[name];   // two screens asking at once share one download
  return INFLIGHT[name]=(async()=>{
    try{
      const r=await fetch(name+'?t='+Date.now(),{cache:'no-store'});
      if(!r.ok)throw new Error(name+' '+r.status);
      const data=await r.json();JC[name]={at:Date.now(),data};return data;
    }finally{delete INFLIGHT[name]}
  })();
}
/* Auto-refresh only redraws a screen when the file really changed, so scroll position and open players are kept */
const DRAWN={};
const fresh=(key,d,force)=>{const g=d&&d.generated;if(!force&&g&&DRAWN[key]===g)return false;DRAWN[key]=g;return true};
/* Watchlist is saved on this phone only */
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let WATCH=store.get('edge.watch',[]);
const isW=s=>WATCH.includes(s);
function toggleWatch(s,ev){
  if(ev)ev.stopPropagation();
  WATCH=isW(s)?WATCH.filter(x=>x!==s):[...WATCH,s];store.set('edge.watch',WATCH);
  document.querySelectorAll('.star[data-s="'+CSS.escape(s)+'"]').forEach(b=>{b.classList.toggle('on',isW(s));b.textContent=isW(s)?'★':'☆'});
  if(CUR==='watch')renderWatch();
}
const starBtn=s=>`<button class="star ${isW(s)?'on':''}" data-s="${esc(s)}" onclick="toggleWatch('${esc(s)}',event)" aria-label="Add to watchlist">${isW(s)?'★':'☆'}</button>`;
/* Tiny 7-day price line */
function spark(a,w=64,h=22){
  if(!a||a.length<2)return '';
  const lo=Math.min(...a),hi=Math.max(...a),r=hi-lo||1;
  const pts=a.map((v,i)=>(i*(w-2)/(a.length-1)+1).toFixed(1)+','+(h-1-(v-lo)/r*(h-2)).toFixed(1)).join(' ');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${a[a.length-1]>=a[0]?'var(--green)':'var(--red)'}" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
}
const SECT={BANK:'Banks & finance',IT:'IT',AUTO:'Auto',OMC:'Oil marketing',UPSTREAM:'Oil & gas',PAINT:'Paints',AVIATION:'Aviation',METALS:'Metals',FMCG:'FMCG',NEWAGE:'New-age tech',INFRA:'Infra',POWER:'Power',PHARMA:'Pharma',DEFENCE:'Defence',REALTY:'Realty',TELECOM:'Telecom',OTHER:'Other'};
const secName=s=>SECT[s]||(s?s.charAt(0)+s.slice(1).toLowerCase():'Other');
function stockRow(s,extra){
  return `<div class="row">${starBtn(s.sym)}<div class="nm"><b>${esc(s.sym)}</b><span>${esc(s.name||'')} · ${esc(secName(s.sector))}</span></div>${spark(s.spark)}<div class="px">${s.price!=null?s.price.toLocaleString('en-IN',{maximumFractionDigits:2}):'n/a'}${chg(s)}</div></div>${extra||''}`;
}
/* Warn when a file is older than its workflow should allow */
function staleNote(iso,maxMin,wf){
  const m=(Date.now()-new Date(iso))/60000;
  if(!(m>maxMin))return '';
  return `<span class="warn">This data is ${ago(iso).replace(' ago','')} old. GitHub runs scheduled jobs late at busy times. To refresh now: GitHub → Actions → <b>${wf}</b> → Run workflow.</span>`;
}
$('apps').innerHTML = APPS.map(a=>`<button class="app ${a.soon?'soon':''}" ${a.soon?'':`onclick="go('${a.page}')"`}><div class="ico" style="background:${a.color}">${a.icon}</div>${a.name}</button>`).join('');
function tick(){const d=new Date();$('clock').textContent=d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});$('date').textContent=d.toLocaleDateString([], {weekday:'long',day:'numeric',month:'long'})}
tick();setInterval(tick,20000);

const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ago=iso=>{const m=Math.max(0,Math.round((Date.now()-new Date(iso))/60000));return m<60?m+'m ago':m<1440?Math.round(m/60)+'h ago':Math.round(m/1440)+'d ago'};
const list=(items,n=6)=>items&&items.length?items.slice(0,n).map(i=>`<a class="n" href="${esc(i.link)}" target="_blank" rel="noopener">${esc(i.title)}<span class="meta">${esc(i.src)} · ${ago(i.time)}</span></a>`).join(''):'<div class="empty">No fresh items.</div>';
const card=(h,b)=>`<div class="card"><h3>${h}</h3>${b}</div>`;
const chg=q=>q&&q.chg!=null?`<span class="${q.chg>=0?'pos':'neg'}">${q.chg>=0?'+':''}${q.chg.toFixed(2)}%</span>`:'';

const TABS=[['News','p0'],['Market','pm'],['Macro data','p1'],['RBI','p2'],['Government','p3'],['Stocks','p4'],['🌐 Live news','p5']];
$('tabs').innerHTML=TABS.map(([t,p],i)=>`<button class="tab ${i?'':'on'}" onclick="tab('${p}')">${t}</button>`).join('');
function tab(p){
  if(p!=='p5')stopLive();else loadLive().then(()=>{if(liveOpen)renderLive()});
  document.querySelectorAll('#tabs .tab').forEach((e,k)=>e.classList.toggle('on',TABS[k][1]===p));
  document.querySelectorAll('#edge .panel').forEach(e=>e.classList.toggle('on',e.id===p));
}
/* Market tab: breadth, sector heat and top movers across the stocks the engine follows */
function renderMarket(d){
  const M=(d.market||[]).filter(s=>s.chg!=null);
  if(!M.length){$('pm').innerHTML=card('Market','<div class="empty">Stock prices appear after the next update-data run with the new fetch_data.py.</div>');return}
  const up=M.filter(s=>s.chg>0).length,dn=M.filter(s=>s.chg<0).length,fl=M.length-up-dn;
  const avg=M.reduce((a,s)=>a+s.chg,0)/M.length;
  let h=card('Breadth',`<div style="display:flex;justify-content:space-between;font-size:13px"><span class="pos">▲ ${up} up</span><span class="meta" style="margin:0">${fl} flat</span><span class="neg">${dn} down ▼</span></div>
    <div class="breadth"><i style="width:${100*up/M.length}%;background:var(--green)"></i><i style="width:${100*fl/M.length}%;background:var(--mute)"></i><i style="width:${100*dn/M.length}%;background:var(--red)"></i></div>
    <div class="meta">Average move of ${M.length} large stocks: ${chg({chg:avg})}. ${up>dn*2?'Broad buying.':dn>up*2?'Broad selling.':'Mixed market.'}</div>`);
  const by={};M.forEach(s=>(by[s.sector]=by[s.sector]||[]).push(s));
  const secs=Object.entries(by).map(([k,v])=>({k,n:v.length,a:v.reduce((x,s)=>x+s.chg,0)/v.length})).sort((a,b)=>b.a-a.a);
  const tint=a=>{const t=Math.min(1,Math.abs(a)/2.5);return a>=0?`rgba(47,191,113,${.12+.45*t})`:`rgba(255,92,92,${.12+.45*t})`};
  h+=card('Sector heat (average day move)','<div class="heat">'+secs.map(x=>`<div style="background:${tint(x.a)}">${esc(secName(x.k))}<b>${x.a>=0?'+':''}${x.a.toFixed(2)}%</b><span class="meta" style="margin:0">${x.n} stock${x.n>1?'s':''}</span></div>`).join('')+'</div>');
  const srt=M.slice().sort((a,b)=>b.chg-a.chg);

/* Plain-language verdict on a hit rate: is it better than a coin flip, or could it be luck? */
function verdict(x){
  if(!x||!x.total)return '';
  if(x.total<30)return '<span class="meta">Too few results to judge yet (needs about 30).</span>';
  if(x.z>=2)return '<span class="pos">Better than a coin flip so far</span>';
  if(x.z<=-2)return '<span class="neg">Worse than a coin flip so far</span>';
  return '<span class="meta">Not clearly different from a coin flip yet</span>';
}
const pct=(h,t)=>t?Math.round(100*h/t)+'%':'-';
const sgnp=v=>v==null?'-':`<span class="${v>=0?'pos':'neg'}">${v>=0?'+':''}${v}%</span>`;
function trackRecord(S){
  const row=(n,x)=>x&&x.total?`<tr><td>${n}</td><td>${x.total}</td><td>${pct(x.hits,x.total)}</td><td>${x.oc_total?pct(x.oc_hits,x.oc_total):'-'}</td><td>${sgnp(x.avg_pct)}</td></tr>`:'';
  const tiers=S.tiers?Object.entries(S.tiers).map(([k,v])=>row(k,v)).join(''):'';
  let h=`<div class="verdict">${verdict(S.all)}</div>
    <div class="tw"><table class="ltab"><tr><th>Group</th><th>Picks</th><th>Hit close→close</th><th>Hit open→close</th><th>Avg move</th></tr>
    ${row('All',S.all)}${row('▲ Up',S.up)}${row('▼ Down',S.down)}${row('With trend',S.with_trend)}${row('Against trend',S.against_trend)}${tiers}</table></div>
    <div class="meta" style="margin-top:6px"><b>Open→close</b> is the trade you can really take after reading the picks in the evening (buy at the next open, sell at the close). <b>Avg move</b> is in the pick's direction, before costs (about 0.1% per trade).</div>`;
  if(S.down&&S.down.total>=30&&S.down.z<=-2)h+=`<span class="warn">Down picks have been right only ${pct(S.down.hits,S.down.total)} of the time. Treat them as a watch list, not as short trades.</span>`;
  const L=S.layers||{};const names={news:'Company news',sector:'Sector news',technical:'Chart trend',relative:'Strength vs Nifty',flow:'Volume',market:'Market trend'};
  const lk=Object.keys(L).filter(k=>L[k].total);
  if(lk.length)h+=`<h3 style="margin:12px 0 2px;font-size:14px">Which layers actually predict?</h3><table class="ltab"><tr><th>Layer</th><th>Times it had a view</th><th>Right</th></tr>${lk.sort((a,b)=>L[b].hits/L[b].total-L[a].hits/L[a].total).map(k=>`<tr><td>${names[k]||esc(k)}</td><td>${L[k].total}</td><td class="${L[k].hits/L[k].total>=.55?'pos':L[k].hits/L[k].total<=.45?'neg':''}">${pct(L[k].hits,L[k].total)}</td></tr>`).join('')}</table><div class="meta" style="margin-top:4px">A layer stuck near 50% after 100+ views adds noise. That is a good candidate to give less weight in pick_engine.py.</div>`;
  else h+='<div class="meta" style="margin-top:6px">Per-layer accuracy appears once new picks (saved with their layers) have results.</div>';
  return h;
}

/* Live tab icon and title: green when picks lean up, red when they lean down, saffron when balanced */
function setBadge(up,down){
  try{
    const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');
    x.fillStyle='#0e1a2b';x.fillRect(0,0,64,64);
    x.lineWidth=5;x.strokeStyle='#ff9933';x.beginPath();x.arc(32,32,26,0,7);x.stroke();
    const col=up>down?'#2fbf71':down>up?'#ff5c5c':'#ff9933';
    x.fillStyle=col;x.beginPath();
    if(down>up){x.moveTo(32,48);x.lineTo(46,26);x.lineTo(18,26);}else{x.moveTo(32,16);x.lineTo(46,38);x.lineTo(18,38);}
    x.fill();
    let l=document.querySelector('link[rel="icon"]');if(!l){l=document.createElement('link');l.rel='icon';document.head.appendChild(l)}
    l.type='image/png';l.href=c.toDataURL('image/png');
    document.title='Edge ▲'+up+' ▼'+down;
  }catch(e){}
}

  $('wbody').innerHTML=card(`My stocks (${mine.length})${avg!=null?' · avg '+chg({chg:avg}):''}`,mine.map(s=>{
    const nw=wNews(s),pk=wPick(s.sym);
    return stockRow(s,(pk||nw.length)?`<div class="wn">${pk}${nw.map(n=>`<a href="${esc(n.link)}" target="_blank" rel="noopener">📰 ${esc(n.title)} <span class="meta" style="display:inline">${esc(n.src)} · ${ago(n.time)}</span></a>`).join('')}</div>`:'');
  }).join(''));
}
function renderWatchAll(){
  if(!WD)return;
  const q=($('wq').value||'').trim().toLowerCase();
  const M=(WD.market||[]).filter(s=>!q||(s.sym+' '+s.name+' '+secName(s.sector)).toLowerCase().includes(q));
  $('wall').innerHTML=M.length?card(q?'Matches':'All stocks the engine follows',M.map(s=>stockRow(s)).join('')):'<div class="empty">No match.</div>';
}

let LIVE_FAIL={};
let LIVE=null,POOL=[],liveOpen=false,LIVE_DBG=[],LIVE_OLD=false,LIVE_BUILTIN=false,SOUND=-1;
const SHOW=6;   // the globe always shows 6 windows
const BUILTIN=[{name:'CNBC-TV18',id:'UCmRbHAgG2k2vDUvb3xsEunQ'},{name:'CNBC Awaaz',id:'UCQIycDaLsBpMKjOCeaKUYVg'},{name:'CNBC TV (US)',id:'UCrp_UI8XtuYfpiqluWLD7Lw'},
  {name:'Yahoo Finance',id:'UCEAZeUIeJs0IjQiqTCdVSIg'},{name:'Bloomberg Markets',id:'UCrM7B7SL_g1edFOnmj-SDKg'}];
/* Windows are filled in this order, and a window that fails is refilled from the same list instead of disappearing:
   1. channels the server found live now  2. the latest market videos (always play, e.g. on weekends when most channels are off air)
   3. built-in channel list (unverified)  */
async function loadLive(){
  let l=[],vids=[];
  try{const d=await getJSON('global.json');
    l=(d.live||[]).filter(x=>x.video_id).sort((a,b)=>(a.embeddable===false)-(b.embeddable===false));
    vids=(d.videos||[]).filter(v=>v.id&&v.business!==false).concat((d.videos||[]).filter(v=>v.id&&v.business===false));
    LIVE_DBG=d.live_debug||[];LIVE_OLD=!('live' in d)}catch(e){LIVE_DBG=[];LIVE_OLD=false}
  LIVE_BUILTIN=!l.length;
  const all=[],seen=new Set();
  const add=x=>{const k=x.video_id||x.id;if(!seen.has(k)){seen.add(k);all.push(x)}};
  l.forEach(x=>add({...x,kind:'live'}));
  // one video per channel first, then second ones, so the 6 windows are varied
  const rounds=[],cnt={};vids.forEach(v=>{const r=cnt[v.channel]=(cnt[v.channel]||0)+1;(rounds[r-1]=rounds[r-1]||[]).push(v)});
  rounds.flat().forEach(v=>add({name:v.channel,video_id:v.id,title:v.title,kind:'video'}));
  BUILTIN.forEach(b=>{if(!l.some(x=>x.id===b.id))add({name:b.name,id:b.id,kind:'channel',extra:true})});
  LIVE=all.slice(0,SHOW);POOL=all.slice(SHOW);
}
function livePoster(x){return '<div style="text-align:center">▶'+(x.embeddable===false?'<div style="font-size:11px;opacity:.85">opens on YouTube</div>':'')+'</div>'}
function liveSrc(x){
  const o=(location.protocol.startsWith('http')?'&origin='+encodeURIComponent(location.origin):'');
  const base='autoplay=1&mute=1&playsinline=1&rel=0&enablejsapi=1'+o;
  return x.video_id?'https://www.youtube.com/embed/'+encodeURIComponent(x.video_id)+'?'+base:'https://www.youtube.com/embed/live_stream?channel='+encodeURIComponent(x.id)+'&'+base;
}
function liveFrame(x,i){return '<iframe id="lf'+i+'" src="'+liveSrc(x)+'" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" onload="ytListen('+i+')"></iframe>'}
function ytCmd(k,func,args){const f=$('lf'+k);if(f&&f.contentWindow)f.contentWindow.postMessage(JSON.stringify({event:'command',func:func,args:args||[]}),'*')}
function ytListen(k){const f=$('lf'+k);if(f&&f.contentWindow)f.contentWindow.postMessage(JSON.stringify({event:'listening',id:k}),'*')}
function updateSnd(){if(!LIVE)return;LIVE.forEach((x,k)=>{const b=$('snd'+k);if(b&&x.embeddable!==false)b.textContent=(SOUND===k)?'🔊 Sound on (tap to mute)':'🔇 Tap for sound'})}
function toggleSound(i){
  if(SOUND===i){ytCmd(i,'mute');SOUND=-1}
  else{if(SOUND>=0)ytCmd(SOUND,'mute');ytCmd(i,'unMute');ytCmd(i,'setVolume',[80]);ytCmd(i,'playVideo');SOUND=i}
  updateSnd();
}
async function toggleLive(){if(!liveOpen)await loadLive();liveOpen=!liveOpen;if(!liveOpen)stopLive();renderLive()}
function renderLive(){
  const g=$('liveGrid');
  if(!liveOpen){g.style.display='none';g.innerHTML='';$('globehint').textContent='Tap the globe for live share-market news';return}
  $('globehint').textContent='All live windows play muted. Tap "Tap for sound" under one window to hear it.';
  g.style.display='grid';SOUND=-1;LIVE_FAIL={};
  let note='<div class="note" id="failnote" style="grid-column:1/-1;display:none"></div><div class="note" style="grid-column:1/-1">'+LIVE.length+' windows playing together, muted. This uses a lot of mobile data and battery. <button class="ref" onclick="stopLive()">⏸ Stop all</button> <button class="ref" onclick="renderLive()">▶ Play all</button></div>';
  const nLive=LIVE.filter(x=>x.kind==='live').length;
  if(nLive<SHOW)note+='<div class="note" style="grid-column:1/-1">'+(nLive?nLive+' channel'+(nLive>1?'s are':' is')+' live right now.':'No business channel is live right now.')+' The other windows show the <b>latest</b> market videos'+(LIVE.some(x=>x.extra)?' or channels from the built-in list (unverified)':'')+'. Business channels are often off air on weekends and holidays. If a window can\'t play, it switches to another stream.</div>';
  if(LIVE_OLD)note+='<div class="note" style="grid-column:1/-1">global.json is from an old script: upload the new global_edge.py and run the global-edge workflow.</div>';
  g.innerHTML=note+LIVE.map((x,i)=>`<div class="lw" id="lw${i}">${liveCell(x,i)}</div>`).join('');
}
function liveCell(x,i){
  const blocked=x.embeddable===false, yt=x.video_id?'https://www.youtube.com/watch?v='+esc(x.video_id):'https://www.youtube.com/channel/'+esc(x.id)+'/live';
  const tag=x.kind==='live'?'<span class="hi">LIVE</span>':x.kind==='video'?'<span class="hi md">LATEST</span>':'<span class="hi md">unverified</span>';
  return `<div class="lh"><b>${esc(x.name)}</b>${tag}</div>${x.title?`<div class="meta" style="font-size:11px;line-height:1.3;margin:-2px 0 4px;padding:0 10px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical">${esc(x.title)}</div>`:''}<div class="lv" id="lv${i}" ${blocked?`onclick="window.open('${yt}','_blank')"`:`onclick="startOne(${i})"`}>${blocked?livePoster(x):liveFrame(x,i)}</div>
      <div class="lh" id="ft${i}">${blocked?`<a class="meta" style="color:var(--saff)" href="${yt}" target="_blank" rel="noopener">Open on YouTube (sound)</a>`:`<button class="snd" id="snd${i}" onclick="toggleSound(${i})">🔇 Tap for sound</button>`}</div>`;
}
function stopLive(){
  if(!LIVE)return;
  SOUND=-1;
  LIVE.forEach((x,k)=>{const e=$('lv'+k);if(e)e.innerHTML=livePoster(x)});
  updateSnd();
}

function liveFailed(k){
  if(!LIVE||!LIVE[k]||LIVE_FAIL[k+':'+(LIVE[k].video_id||LIVE[k].id)])return;
  LIVE_FAIL[k+':'+(LIVE[k].video_id||LIVE[k].id)]=true;
  const x=LIVE[k],c=$('lw'+k);
  const next=POOL.shift();
  if(next&&c){          // swap in the next stream or video, keep 6 windows
    if(SOUND===k)SOUND=-1;
    LIVE[k]=next;c.innerHTML=liveCell(next,k);return;
  }
  const yt=x.video_id?'https://www.youtube.com/watch?v='+x.video_id:'https://www.youtube.com/channel/'+x.id+'/live';
  const e=$('lv'+k);if(e){e.innerHTML='<div style="font-size:12px;padding:8px;text-align:center">Not playing here right now.<br>Tap to open on YouTube</div>';e.onclick=()=>window.open(yt,'_blank')}
  const f=$('ft'+k);if(f)f.innerHTML='<a class="meta" style="color:var(--saff)" href="'+yt+'" target="_blank" rel="noopener">Open on YouTube (sound)</a>';
}
if(window.addEventListener)window.addEventListener('message',ev=>{
  if(typeof ev.data!=='string'||!/youtube/.test(ev.origin||''))return;
  let d;try{d=JSON.parse(ev.data)}catch(e){return}
  if(d&&d.event==='onError'&&d.id!==undefined)liveFailed(Number(d.id));
});
function startOne(i){const e=$('lv'+i);if(e&&LIVE&&LIVE[i]&&LIVE[i].embeddable!==false&&!e.querySelector('iframe'))e.innerHTML=liveFrame(LIVE[i],i)}
/* Keep the open screen fresh: every 5 min while visible, and right away when you come back to the app */
/* soft refresh: download again, but redraw only if the file changed */
const soft=name=>{delete JC[name]};
const RELOAD={edge:()=>{soft('data.json');if(!$('p5').classList.contains('on'))loadEdge()},picks:()=>{soft('picks.json');loadPicks()},
  global:()=>{if(glTab!=='videos'){soft('global.json');loadGlobal()}},watch:()=>{soft('data.json');loadWatch()}};
setInterval(()=>{if(!document.hidden&&RELOAD[CUR])RELOAD[CUR]()},300000);
let hiddenAt=0;
document.addEventListener('visibilitychange',()=>{if(document.hidden){hiddenAt=Date.now();return}if(Date.now()-hiddenAt>120000&&RELOAD[CUR])RELOAD[CUR]()});
const net=()=>{$('offline').style.display=navigator.onLine?'none':'block'};addEventListener('online',net);addEventListener('offline',net);net();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
show(location.hash.slice(1)||'home');
</script>
