<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pharmacy Bill</title>
<meta name="description" content="Pharmacy purchase bills, stock and expiry, with automatic bill reading.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0f766e">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><span class="logo">℞</span><div><b id="shopName">Pharmacy Bill</b><small>Purchase · Stock · Expiry</small></div></div>
    <nav id="nav"></nav>
    <div class="side-foot"><span id="dataInfo"></span></div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menu">☰</button>
      <h1 id="pageTitle">Dashboard</h1>
      <div class="top-actions" id="topActions"></div>
    </header>
    <div class="page" id="page"></div>
  </main>
</div>
<button class="fab" id="fab" title="Scan a bill" aria-label="Scan a bill">📷</button>
<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="modal-box" id="modalBox"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="pickFile" hidden>

<script src="js/db.js"></script>
<script src="js/import.js"></script>
<script src="js/ai.js"></script>
<script src="js/app.js"></script>
</body>
</html>
