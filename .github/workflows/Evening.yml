name: evening-picks

on:
  schedule:
    - cron: "17 11 * * 1-5"   # 4:47 PM India time, Mon-Fri. GitHub often starts scheduled jobs late; off-the-hour times are delayed less
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: evening-picks
  cancel-in-progress: false

jobs:
  picks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run pick engine
        run: python pick_engine.py
      - name: Commit results
        run: |
          git config user.name "india-edge-bot"
          git config user.email "bot@users.noreply.github.com"
          git add picks.json picks_history.json
          git diff --staged --quiet && exit 0
          git commit -m "evening picks"
          # several workflows push to the same branch: retry if another one pushed first
          for i in 1 2 3 4 5; do git pull --rebase && git push && exit 0; sleep $((i*5)); done
          exit 1
