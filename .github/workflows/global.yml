name: global-edge

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: global-edge
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build global news and videos
        run: python global_edge.py
      - name: Commit global.json
        run: |
          git config user.name "india-edge-bot"
          git config user.email "bot@users.noreply.github.com"
          git add global.json
          git diff --staged --quiet && exit 0
          git commit -m "global update"
          # several workflows push to the same branch: retry if another one pushed first
          for i in 1 2 3 4 5; do git pull --rebase && git push && exit 0; sleep $((i*5)); done
          exit 1
