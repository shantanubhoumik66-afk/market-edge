name: backtest

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run backtest
        run: python backtest.py
      - name: Commit results
        run: |
          git config user.name "india-edge-bot"
          git config user.email "bot@users.noreply.github.com"
          git add backtest.json
          git diff --staged --quiet || (git commit -m "backtest results" && git pull --rebase && git push)
