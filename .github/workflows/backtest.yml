name: backtest

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run backtest
        run: python backtest.py
      - name: Commit results
        run: |
          git config user.name "india-edge-bot"
          git config user.email "bot@users.noreply.github.com"
          git add backtest.json
          git diff --staged --quiet && exit 0
          git commit -m "backtest results"
          # several workflows push to the same branch: retry if another one pushed first
          for i in 1 2 3 4 5; do git pull --rebase && git push && exit 0; sleep $((i*5)); done
          exit 1
