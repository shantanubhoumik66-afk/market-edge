name: evening-picks

on:
  schedule:
    - cron: "0 12 * * 1-5"   # 5:30 PM India time, Monday to Friday
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: evening-picks
  cancel-in-progress: false

jobs:
  picks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run pick engine
        run: python pick_engine.py
      - name: Commit results
        run: |
          git config user.name "india-edge-bot"
          git config user.email "bot@users.noreply.github.com"
          git add picks.json picks_history.json
          git diff --staged --quiet || (git commit -m "evening picks" && git pull --rebase && git push)
